services:
  elnino:
    build: .
    image: elnino-monitor:latest
    container_name: elnino
    restart: unless-stopped
    # Only reachable from the host; Caddy on the host terminates TLS and proxies here.
    # ELNINO_PORT picks the host port Caddy connects to (default 8080).
    ports:
      - "127.0.0.1:${ELNINO_PORT:-8080}:8080"
    environment:
      CONTACT: "${CONTACT:-admin@example.com}"   # sent in the User-Agent to data providers
      SST_DAYS: "90"
      RUST_LOG: "info,tower_http=warn"
      # Set to /inbox/senamhi.json in .env when a relay uploads SENAMHI data (see README).
      SENAMHI_INBOX: "${SENAMHI_INBOX:-}"
    # Public resolvers: some Peruvian government domains (igp.gob.pe, imarpe.gob.pe)
    # have flaky authoritative DNS, and VPS-provider resolvers tend to cache failures.
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    volumes:
      - elnino-data:/data
      # SENAMHI relay uploads; create it (owned by the upload user) before `up`.
      - ./inbox:/inbox:ro
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  elnino-data:
