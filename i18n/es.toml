method_title = "Metodología"
method_indices_title = "Índices"
method_indices = "Niño 3.4 y Niño 1+2 semanales, ONI, RONI y SOI provienen de NOAA CPC (base 1991–2020); MEI.v2, de NOAA PSL; ICEN, del IGP según la definición del ENFEN (2024). Los valores trimestrales se fechan en su mes central (por ejemplo, JAS = agosto). Las categorías de intensidad usan los umbrales habituales de NOAA sobre ONI/RONI (0.5, 1.0, 1.5 y 2.0 °C) y del ENFEN sobre el ICEN (0.4, 1.0, 1.7 y 3.0 °C)."
method_sst_title = "Temperatura del mar"
method_sst = "Usamos el análisis diario OISST v2.1 de NOAA NCEI (versión preliminar, ~1 día de retraso), submuestreado a 1° y proyectado en Mercator. Sus anomalías se calculan respecto a 1971–2000, por lo que son algo más altas que las de CPC. Los índices diarios son medias ponderadas por latitud dentro de cada región y no son oficiales."
method_events_title = "Eventos"
method_events = "Se muestran inundaciones, sequías, ciclones tropicales e incendios con alerta naranja o roja de GDACS (Comisión Europea – JRC y ONU – OCHA). Que un evento coincida con un impacto típico de El Niño no implica que El Niño lo haya causado."
method_updates_title = "Frecuencia de actualización"
method_updates = "El servidor consulta cada fuente según su ritmo de publicación: GDACS cada 30 minutos, ENFEN y los productos semanales y diarios cada 6 horas, y los índices mensuales cada 12 horas. Solo se procesa lo que cambió (cabeceras ETag/Last-Modified y huella del contenido)."

