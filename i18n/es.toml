explain_what_title = "¿Qué es El Niño?"
explain_what = "Es el calentamiento anormal del Pacífico ecuatorial central y oriental, acoplado a un debilitamiento de los vientos alisios. Ocurre cada 2 a 7 años, dura de 9 a 18 meses y reorganiza la lluvia tropical, alterando el clima de buena parte del planeta."
explain_coastal_title = "El Niño Costero"
explain_coastal = "Frente a Perú y Ecuador el mar puede calentarse incluso cuando el Pacífico central no lo hace (como en 2017). Por eso Perú usa su propio índice (ICEN, región Niño 1+2) y su propio sistema de alerta, a cargo del ENFEN."
explain_global_title = "Efectos en el mundo"
explain_global = "Sequías en Indonesia, Australia y el sur de África; lluvias en África Oriental y el sur de Sudamérica; monzón indio más débil; menos huracanes en el Atlántico; y años globalmente más cálidos."
go_peru = "Ver Perú"
go_impacts = "Ver impactos globales"

