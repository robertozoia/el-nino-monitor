peru_explain1_title = "Lluvias en la costa norte"
peru_explain1 = "Con el mar caliente, la costa de Tumbes, Piura, Lambayeque y La Libertad recibe lluvias que normalmente no tiene, sobre todo de enero a abril: activación de quebradas, huaicos e inundaciones."
peru_explain2_title = "Pesca y ecosistema"
peru_explain2 = "El agua cálida empobrece el afloramiento de nutrientes; la anchoveta se profundiza o migra al sur y las temporadas de pesca se reducen o suspenden, mientras llegan especies tropicales."
peru_explain3_title = "Salud y sur andino"
peru_explain3 = "El calor y la humedad favorecen al mosquito del dengue en la costa norte. En el altiplano sur, en cambio, El Niño suele asociarse a menos lluvias y heladas."

