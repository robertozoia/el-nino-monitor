region_andean_pacific = "Costa del Pacífico andino (Perú, Ecuador, Colombia)"
region_andean_pacific_season = "Dic–Abr"
region_andean_pacific_typical = "Lluvias intensas, inundaciones y huaicos en la costa norte de Perú y en Ecuador; el mar cálido afecta la pesca. En el altiplano peruano-boliviano y en Colombia, tendencia a menos lluvia."
region_south_america = "Resto de Sudamérica"
region_south_america_season = "Sep–Feb"
region_south_america_typical = "Más lluvia en el sur de Brasil, Uruguay y el noreste de Argentina. Amazonía y norte de Sudamérica: más seco y cálido, con ríos bajos e incendios. Chile central: inviernos más lluviosos."
region_north_central_america = "Centroamérica, Caribe, México y sur de EE. UU."
region_north_central_america_season = "Jun–Nov / Dic–Feb"
region_north_central_america_typical = "Temporada de lluvias más seca en el Corredor Seco centroamericano y el Caribe; menos huracanes en el Atlántico y más en el Pacífico oriental. Inviernos más húmedos en el sur de EE. UU. y el norte de México."
region_east_africa = "África Oriental"
region_east_africa_season = "Oct–Dic"
region_east_africa_typical = "Lluvias cortas por encima de lo normal en Kenia, Somalia, sur de Etiopía y Tanzania, con riesgo de inundaciones; en cambio, la temporada de lluvias de junio a septiembre en las tierras altas de Etiopía tiende a ser más seca."
region_southern_africa = "África Austral"
region_southern_africa_season = "Nov–Mar"
region_southern_africa_typical = "Temporada de lluvias más seca y calurosa: sequía, malas cosechas de maíz y deterioro de la seguridad alimentaria en Zimbabue, Malaui, Zambia, Mozambique y Sudáfrica."
region_south_asia = "Asia del Sur"
region_south_asia_season = "Jun–Sep"
region_south_asia_typical = "El monzón indio tiende a ser más débil y el calor más intenso, aunque no en todos los eventos. El sur de la India y Sri Lanka pueden recibir más lluvia de octubre a diciembre."
region_se_asia_australia = "Sudeste asiático y Australia"
region_se_asia_australia_season = "Jun–Dic"
region_se_asia_australia_typical = "Condiciones más secas en Indonesia, Filipinas, Malasia, Papúa Nueva Guinea y el este de Australia: sequía agrícola, incendios de turberas y humo transfronterizo; mayor riesgo de blanqueamiento de corales."
region_pacific_islands = "Islas del Pacífico"
region_pacific_islands_season = "Todo el evento"
region_pacific_islands_typical = "Más lluvia en el Pacífico central (Kiribati, Tuvalu) y sequía en el Pacífico occidental (Micronesia, Fiyi, Islas Salomón). Los ciclones tropicales se forman más al este de lo habitual."

sources_title = "Fuentes y metodología"
sources_intro = "Todos los datos provienen de organismos oficiales y se descargan automáticamente. Cada número del sitio indica su fuente y su fecha."
