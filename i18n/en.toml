explain_what_title = "What is El Niño?"
explain_what = "It is the unusual warming of the central and eastern equatorial Pacific, coupled with weaker trade winds. It recurs every 2 to 7 years, lasts 9 to 18 months, and reorganises tropical rainfall, disrupting weather across much of the planet."
explain_coastal_title = "Coastal El Niño"
explain_coastal = "Off Peru and Ecuador the sea can warm even when the central Pacific does not (as in 2017). That is why Peru uses its own index (ICEN, Niño 1+2 region) and its own alert system, run by ENFEN."
explain_global_title = "Effects around the world"
explain_global = "Drought in Indonesia, Australia and southern Africa; heavy rain in East Africa and southern South America; a weaker Indian monsoon; fewer Atlantic hurricanes; and globally warmer years."
go_peru = "See Peru"
go_impacts = "See global impacts"

