peru_explain1_title = "Rain on the northern coast"
peru_explain1 = "With a warm sea, the normally arid coast of Tumbes, Piura, Lambayeque and La Libertad gets heavy rain, mostly from January to April: flash floods, debris flows and river flooding."
peru_explain2_title = "Fisheries and ecosystem"
peru_explain2 = "Warm water weakens nutrient upwelling; anchoveta move deeper or south and fishing seasons are cut or cancelled, while tropical species arrive."
peru_explain3_title = "Health and the southern Andes"
peru_explain3 = "Heat and humidity favour the dengue mosquito on the northern coast. On the southern Altiplano, by contrast, El Niño usually means less rain and more frost."

