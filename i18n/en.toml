region_north_central_america_typical = "Drier rainy season in Central America's Dry Corridor and the Caribbean; fewer Atlantic hurricanes and more in the eastern Pacific. Wetter winters across the southern US and northern Mexico."
region_east_africa = "East Africa"
region_east_africa_season = "Oct–Dec"
region_east_africa_typical = "Above-normal short rains in Kenya, Somalia, southern Ethiopia and Tanzania, with flood risk; the June–September rains in the Ethiopian highlands tend to be drier."
region_southern_africa = "Southern Africa"
region_southern_africa_season = "Nov–Mar"
region_southern_africa_typical = "Drier, hotter rainy season: drought, poor maize harvests and worsening food security in Zimbabwe, Malawi, Zambia, Mozambique and South Africa."
region_south_asia = "South Asia"
region_south_asia_season = "Jun–Sep"
region_south_asia_typical = "The Indian monsoon tends to be weaker and heat more intense, though not in every event. Southern India and Sri Lanka can get more rain from October to December."
region_se_asia_australia = "Southeast Asia and Australia"
region_se_asia_australia_season = "Jun–Dec"
region_se_asia_australia_typical = "Drier conditions in Indonesia, the Philippines, Malaysia, Papua New Guinea and eastern Australia: agricultural drought, peatland fires and transboundary haze; higher coral bleaching risk."
region_pacific_islands = "Pacific Islands"
region_pacific_islands_season = "Whole event"
region_pacific_islands_typical = "Wetter in the central Pacific (Kiribati, Tuvalu) and drought in the western Pacific (Micronesia, Fiji, Solomon Islands). Tropical cyclones form further east than usual."

sources_title = "Sources & methodology"
sources_intro = "All data come from official agencies and are downloaded automatically. Every number on this site shows its source and date."
data_sources = "Data sources"
data_sources_sub = "Automatic download status for each source."
dataset = "Dataset"
publishes = "Publishes"
last_check = "Last checked"
last_new_data = "Last new data"
status = "Status"
status_ok = "Up to date"
status_error = "Error"
status_stale = "Stale"
status_pending = "Pending"
more_reading = "Bulletins & further reading"
more_reading_sub = "Lower-frequency publications from other forecast centres."
method_title = "Methodology"
method_indices_title = "Indices"
method_indices = "Weekly Niño 3.4 and Niño 1+2, ONI, RONI and SOI come from NOAA CPC (1991–2020 base); MEI.v2 from NOAA PSL; ICEN from IGP following ENFEN's 2024 definition. Three-month values are dated at their centre month (e.g. JAS = August). Strength categories use NOAA's usual ONI/RONI thresholds (0.5, 1.0, 1.5 and 2.0 °C) and ENFEN's ICEN thresholds (0.4, 1.0, 1.7 and 3.0 °C)."
method_sst_title = "Sea surface temperature"
method_sst = "We use NOAA NCEI's daily OISST v2.1 analysis (preliminary version, ~1 day lag), subsampled to 1° and projected to Mercator. Its anomalies are relative to 1971–2000, so they run slightly higher than CPC's. Daily indices are latitude-weighted means within each region and are unofficial."
method_events_title = "Events"
method_events = "Floods, droughts, tropical cyclones and wildfires with an orange or red GDACS alert (European Commission JRC and UN OCHA) are shown. An event matching a typical El Niño impact does not mean El Niño caused it."
method_updates_title = "Update frequency"
method_updates = "The server checks each source at its publishing rhythm: GDACS every 30 minutes, ENFEN and the weekly and daily products every 6 hours, and the monthly indices every 12 hours. Only changed data are processed (ETag/Last-Modified headers and content hashes)."

